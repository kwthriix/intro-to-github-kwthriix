name: Commit and Autotest

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agents/**
  pull_request:
    branches:
      - main

permissions:
  contents: write
  checks: write

jobs:
  commit-changes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Check for changes
        id: check-changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has-changes=true" >> $GITHUB_OUTPUT
          else
            echo "has-changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        if: steps.check-changes.outputs.has-changes == 'true'
        run: |
          git add -A
          git commit -m "chore: automated commit by GitHub Action"

      - name: Push changes
        if: steps.check-changes.outputs.has-changes == 'true'
        run: git push

  run-tests:
    needs: commit-changes
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run shell tests
        id: run-tests
        run: |
          if [ -f "./tests/validate_studentinfo.sh" ]; then
            chmod +x ./tests/validate_studentinfo.sh
            ./tests/validate_studentinfo.sh || exit_code=$?
            echo "test-result=$exit_code" >> $GITHUB_OUTPUT
          else
            echo "No test script found"
          fi
        continue-on-error: true

      - name: Test Summary
        run: |
          echo "Tests completed!"
          if [ -f "./tests/validate_studentinfo.sh" ]; then
            echo "✅ Test script executed"
          else
            echo "ℹ️ No test script found in ./tests/"
          fi
